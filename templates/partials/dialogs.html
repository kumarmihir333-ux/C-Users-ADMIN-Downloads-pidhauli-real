      <div id="authModal" class="modal hidden">
        <div class="modal-card">
          <div class="modal-head">
            <h3 id="authTitle">Sign in</h3>
            <button class="close-btn" id="closeAuth" type="button">✕</button>
          </div>
          <div id="authTabs" class="auth-tabs">
            <button class="tab active" data-auth-tab="login" type="button">Login</button>
            <button class="tab" data-auth-tab="register" type="button">Register</button>
          </div>
          <form id="loginForm" class="auth-form">
            <label>
              Email
              <input type="email" name="email" required />
            </label>
            <label>
              Password
              <input type="password" name="password" required />
            </label>
            <button class="primary full" type="submit">Continue</button>
          </form>
          <form id="registerForm" class="auth-form hidden">
            <label>
              Full name
              <input type="text" name="full_name" required />
            </label>
            <label>
              Email
              <input type="email" name="email" required />
            </label>
            <label>
              Password
              <input type="password" name="password" required />
            </label>
            <button class="primary full" type="submit">Create account</button>
          </form>
        </div>
      </div>

      <div id="inquiryModal" class="modal hidden">
        <div class="modal-card small">
          <div class="modal-head">
            <h3>Request quotation</h3>
            <button class="close-btn" id="closeInquiry" type="button">✕</button>
          </div>
          <form id="inquiryForm" class="auth-form">
            <input type="hidden" name="crop_name" id="inquiryCrop" />
            <label>
              Your name
              <input type="text" name="buyer_name" required />
            </label>
            <label>
              Phone
              <input type="tel" name="phone" required />
            </label>
            <label>
              Quantity
              <input type="text" name="quantity" required placeholder="e.g. 50 MT" />
            </label>
            <label>
              Message
              <textarea name="message" rows="3" placeholder="Optional details"></textarea>
            </label>
            <button class="primary full" type="submit">Send inquiry</button>
          </form>
        </div>
      </div>
